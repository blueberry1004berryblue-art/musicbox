<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車再生アプリ</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        /* (前のCSSと同じなので省略) */
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>車再生アプリ</h2>
        <label style="background:#1DB954; padding:10px; border-radius:20px; cursor:pointer;">
            フォルダを選択
            <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none;">
        </label>
        <div id="coverContainer" style="width:200px; height:200px; margin:20px auto; background:#333;">
            <img id="coverImage" style="width:100%; height:100%; object-fit:cover; display:none;">
        </div>
        <div id="nowPlaying">曲を選択</div>
        <audio id="audioPlayer" controls style="width:100%;"></audio>
        <ul id="playlist" style="list-style:none; padding:0; text-align:left;"></ul>
    </div>

    <script>
        // 【重要】Service Workerを登録するコード
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                console.log('Service Worker Registered');
            });
        }

        // 既存の再生ロジック
        const folderInput = document.getElementById('folderInput');
        const audioPlayer = document.getElementById('audioPlayer');
        const playlist = document.getElementById('playlist');
        const nowPlaying = document.getElementById('nowPlaying');
        const coverImage = document.getElementById('coverImage');

        let songList = [];

        folderInput.addEventListener('change', (e) => {
            songList = Array.from(e.target.files).filter(f => f.type.startsWith('audio/') || f.name.endsWith('.mp3'));
            renderPlaylist();
        });

        function renderPlaylist() {
            playlist.innerHTML = '';
            songList.forEach((file, i) => {
                const li = document.createElement('li');
                li.textContent = file.name;
                li.onclick = () => playSong(i);
                playlist.appendChild(li);
            });
        }

        function playSong(i) {
            const file = songList[i];
            audioPlayer.src = URL.createObjectURL(file);
            audioPlayer.play();
            nowPlaying.textContent = file.name;
        }
    </script>
</body>
</html>
