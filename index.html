<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; }
        
        /* フォルダ選択ボタン */
        .upload-btn {
            background: #1DB954; color: white; padding: 15px 30px; border-radius: 30px;
            display: inline-block; cursor: pointer; margin-bottom: 20px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s;
        }
        .upload-btn:active { transform: scale(0.95); }
        input[type="file"] { display: none; }

        /* ジャケット画像エリア */
        #coverContainer {
            width: 280px; height: 280px; margin: 10px auto 20px;
            background: #282828; border-radius: 15px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        #coverImage { width: 100%; height: 100%; object-fit: cover; display: none; }
        #placeholder { font-size: 80px; color: #404040; }

        /* 現在の曲情報 */
        #nowPlaying {
            font-size: 1.1em; font-weight: bold; margin-bottom: 10px;
            height: 1.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* プレイヤー操作部分 */
        audio { width: 100%; margin: 10px 0; border-radius: 8px; }
        
        /* リスト部分 */
        #playlist { 
            list-style: none; padding: 0; text-align: left; 
            max-height: 300px; overflow-y: auto; background: #181818; border-radius: 10px;
        }
        #playlist li {
            padding: 15px; border-bottom: 1px solid #282828; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: background 0.2s;
        }
        #playlist li:hover { background: #333; }
        #playlist li.active { color: #1DB954; font-weight: bold; background: #222; }

        /* スクロールバーのカスタマイズ */
        #playlist::-webkit-scrollbar { width: 6px; }
        #playlist::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Music Player</h2>
    
    <label class="upload-btn">
        フォルダを選択
        <input type="file" id="folderInput" webkitdirectory directory multiple>
    </label>

    <div id="coverContainer">
        <div id="placeholder">♪</div>
        <img id="coverImage" alt="Album Art">
    </div>

    <div id="nowPlaying">曲を読み込んでください</div>
    
    <audio id="audioPlayer" controls preload="auto"></audio>

    <ul id="playlist"></ul>
</div>

<script>
    // Service Worker 登録
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

    // データベース設定 (Dexie)
    const db = new Dexie("MyMusicAppDB");
    db.version(1).stores({ songs: "++id, name, data" });

    const folderInput = document.getElementById('folderInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const playlist = document.getElementById('playlist');
    const nowPlaying = document.getElementById('nowPlaying');
    const coverImage = document.getElementById('coverImage');
    const placeholder = document.getElementById('placeholder');

    let songList = [];

    // 起動時に保存データを復元
    window.onload = async () => {
        const savedSongs = await db.songs.toArray();
        if (savedSongs.length > 0) {
            songList = savedSongs;
            renderPlaylist();
            nowPlaying.textContent = "前回のプレイリストを復元しました";
            // 1曲目を準備だけしておく（自動再生はさせない）
            prepareSong(0);
        }
    };

    // フォルダ選択時の処理
    folderInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).filter(f => 
            f.name.match(/\.(mp3|m4a|alac|wav|flac)$/i)
        );

        if (files.length === 0) return;

        nowPlaying.textContent = "保存中...";
        await db.songs.clear();

        for (const file of files) {
            await db.songs.add({ name: file.name, data: file });
        }

        songList = await db.songs.toArray();
        renderPlaylist();
        playSong(0); // 最初の曲を再生
    });

    function renderPlaylist() {
        playlist.innerHTML = '';
        songList.forEach((song, index) => {
            const li = document.createElement('li');
            li.textContent = song.name;
            li.onclick = () => playSong(index);
            playlist.appendChild(li);
        });
    }

    // 再生準備だけ行う（起動時用）
    function prepareSong(index) {
        const song = songList[index];
        const url = URL.createObjectURL(song.data);
        audioPlayer.src = url;
        nowPlaying.textContent = song.name;
        loadCoverArt(song.data);
        updateListHighlight(index);
    }

    // 再生を実行する（メイン処理）
    async function playSong(index) {
        const song = songList[index];
        if (!song) return;

        // 既存のURLを解放してメモリを節約
        if (audioPlayer.src) URL.revokeObjectURL(audioPlayer.src);

        const url = URL.createObjectURL(song.data);
        audioPlayer.src = url;
        
        // 【重要】load()を呼ぶことでブラウザにメディア解析を強制する
        audioPlayer.load();

        nowPlaying.textContent = "読み込み中...";

        // メタデータの読み込みが完了（秒数が確定）したら再生
        audioPlayer.onloadedmetadata = () => {
            nowPlaying.textContent = song.name;
            audioPlayer.play().catch(err => {
                nowPlaying.textContent = "▶ タップして再生を開始";
            });
        };

        // カバー画像とメディアセッションの更新
        loadCoverArt(song.data, (img) => {
            updateMediaSession(song.name, img);
        });

        updateListHighlight(index);
    }

    function updateListHighlight(index) {
        Array.from(playlist.children).forEach((li, i) => {
            li.className = (i === index) ? 'active' : '';
        });
    }

    // ジャケット画像の読み取り
    function loadCoverArt(fileBlob, callback) {
        window.jsmediatags.read(fileBlob, {
            onSuccess: (tag) => {
                const pic = tag.tags.picture;
                if (pic) {
                    let base64 = "";
                    for (let i = 0; i < pic.data.length; i++) base64 += String.fromCharCode(pic.data[i]);
                    const imageUrl = `data:${pic.format};base64,${window.btoa(base64)}`;
                    coverImage.src = imageUrl;
                    coverImage.style.display = 'block';
                    placeholder.style.display = 'none';
                    if (callback) callback(imageUrl);
                } else {
                    showDefaultCover(callback);
                }
            },
            onError: () => showDefaultCover(callback)
        });
    }

    function showDefaultCover(callback) {
        coverImage.style.display = 'none';
        placeholder.style.display = 'block';
        if (callback) callback('https://via.placeholder.com/512');
    }

    // Android通知欄（MediaSession）の更新
    function updateMediaSession(title, imageUrl) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: title,
                artist: 'My Music Player',
                artwork: [{ src: imageUrl, sizes: '512x512', type: 'image/png' }]
            });
            
            // 通知欄の操作ボタン
            navigator.mediaSession.setActionHandler('nexttrack', () => {
                let idx = songList.findIndex(s => s.name === nowPlaying.textContent);
                if (idx < songList.length - 1) playSong(idx + 1);
            });
            navigator.mediaSession.setActionHandler('previoustrack', () => {
                let idx = songList.findIndex(s => s.name === nowPlaying.textContent);
                if (idx > 0) playSong(idx - 1);
            });
        }
    }

    // 曲が終わったら自動で次へ
    audioPlayer.onended = () => {
        let currentIndex = songList.findIndex(s => s.name === nowPlaying.textContent);
        if (currentIndex !== -1 && currentIndex < songList.length - 1) {
            playSong(currentIndex + 1);
        }
    };
</script>
</body>
</html>
