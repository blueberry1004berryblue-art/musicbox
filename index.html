<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js" crossorigin="anonymous"></script>

    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; }
        .upload-btn { background: #1DB954; color: white; padding: 15px 30px; border-radius: 30px; display: inline-block; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
        input[type="file"] { display: none; }
        #coverContainer { width: 260px; height: 260px; margin: 10px auto 20px; background: #282828; border-radius: 15px; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        #coverImage { width: 100%; height: 100%; object-fit: cover; display: none; }
        #placeholder { font-size: 80px; color: #404040; }
        #nowPlaying { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; min-height: 1.5em; color: #1DB954; }
        audio { width: 100%; margin: 10px 0; border-radius: 8px; }
        #playlist { list-style: none; padding: 0; text-align: left; max-height: 300px; overflow-y: auto; background: #181818; border-radius: 10px; }
        #playlist li { padding: 15px; border-bottom: 1px solid #282828; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #playlist li.active { color: #1DB954; background: #222; }
    </style>
</head>
<body>

<div class="container">
    <h2>Music Player</h2>
    <label class="upload-btn">フォルダを選択<input type="file" id="folderInput" webkitdirectory directory multiple></label>
    <div id="coverContainer"><div id="placeholder">♪</div><img id="coverImage"></div>
    <div id="nowPlaying">起動中...</div>
    <audio id="audioPlayer" controls></audio>
    <ul id="playlist"></ul>
</div>

<script>
    // データベースの名前を変更して初期化を確実にする
    const db = new Dexie("MusicBoxV3");
    db.version(1).stores({ songs: "++id, name, data" });

    const audioPlayer = document.getElementById('audioPlayer');
    const nowPlaying = document.getElementById('nowPlaying');
    const coverImage = document.getElementById('coverImage');
    const placeholder = document.getElementById('placeholder');
    const playlist = document.getElementById('playlist');
    let songList = [];

    window.onload = async () => {
        try {
            const saved = await db.songs.toArray();
            if (saved.length > 0) {
                songList = saved;
                renderPlaylist();
                nowPlaying.textContent = "準備完了！";
            } else {
                nowPlaying.textContent = "フォルダを選んでください";
            }
        } catch (e) {
            nowPlaying.textContent = "読み込みエラー";
        }
    };

    document.getElementById('folderInput').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).filter(f => f.name.match(/\.(mp3|m4a|alac|wav|flac)$/i));
        if (files.length === 0) return;
        
        nowPlaying.textContent = "スマホに保存中...";
        await db.songs.clear();
        for (const file of files) {
            await db.songs.add({ name: file.name, data: file });
        }
        songList = await db.songs.toArray();
        renderPlaylist();
        playSong(0);
    });

    function renderPlaylist() {
        playlist.innerHTML = '';
        songList.forEach((s, i) => {
            const li = document.createElement('li');
            li.textContent = s.name;
            li.onclick = () => playSong(i);
            playlist.appendChild(li);
        });
    }

    async function playSong(index) {
        const song = songList[index];
        if (!song) return;

        nowPlaying.textContent = "読み込み中...";
        audioPlayer.pause();
        if (audioPlayer.src) URL.revokeObjectURL(audioPlayer.src);

        // Appleロスレス(ALAC)対応のため、Blobとして読み込み型を指定
        const blob = new Blob([song.data], { type: 'audio/mp4' });
        audioPlayer.src = URL.createObjectURL(blob);
        audioPlayer.load();

        audioPlayer.play().then(() => {
            nowPlaying.textContent = song.name;
            loadCover(song);
        }).catch(() => {
            nowPlaying.textContent = "▶ 再生ボタンをタップ";
        });

        Array.from(playlist.children).forEach((li, i) => {
            li.className = (i === index) ? 'active' : '';
        });
    }

    function loadCover(song) {
        if (typeof jsmediatags === 'undefined') return;
        jsmediatags.read(song.data, {
            onSuccess: (tag) => {
                const pic = tag.tags.picture;
                if (pic) {
                    let base64 = "";
                    for (let i = 0; i < pic.data.length; i++) base64 += String.fromCharCode(pic.data[i]);
                    coverImage.src = `data:${pic.format};base64,${window.btoa(base64)}`;
                    coverImage.style.display = 'block';
                    placeholder.style.display = 'none';
                } else {
                    coverImage.style.display = 'none';
                    placeholder.style.display = 'block';
                }
            },
            onError: () => {
                coverImage.style.display = 'none';
                placeholder.style.display = 'block';
            }
        });
    }
</script>
</body>
</html>
