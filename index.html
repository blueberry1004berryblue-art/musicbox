<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; }
        .upload-btn { background: #1DB954; color: white; padding: 15px; border-radius: 30px; display: inline-block; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
        input[type="file"] { display: none; }
        #coverContainer { width: 250px; height: 250px; margin: 10px auto 20px; background: #222; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #coverImage { width: 100%; height: 100%; object-fit: cover; display: none; }
        #placeholder { font-size: 60px; color: #444; }
        audio { width: 100%; margin: 10px 0; border-radius: 8px; }
        #playlist { list-style: none; padding: 0; text-align: left; max-height: 300px; overflow-y: auto; }
        #playlist li { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #playlist li:hover { background: #222; }
        #playlist li.active { color: #1DB954; font-weight: bold; background: #1a1a1a; }
    </style>
</head>
<body>

<div class="container">
    <h2>Music Player</h2>
    <label class="upload-btn">
        フォルダを選択
        <input type="file" id="folderInput" webkitdirectory directory multiple>
    </label>
    <div id="coverContainer">
        <div id="placeholder">♪</div>
        <img id="coverImage" alt="Album Art">
    </div>
    <div id="nowPlaying">曲を選択してください</div>
    <audio id="audioPlayer" controls></audio>
    <ul id="playlist"></ul>
</div>

<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

    const db = new Dexie("MusicAppDB");
    db.version(1).stores({ songs: "++id, name, data" });

    const folderInput = document.getElementById('folderInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const playlist = document.getElementById('playlist');
    const nowPlaying = document.getElementById('nowPlaying');
    const coverImage = document.getElementById('coverImage');
    const placeholder = document.getElementById('placeholder');

    let songList = [];

    window.onload = async () => {
        const savedSongs = await db.songs.toArray();
        if (savedSongs.length > 0) {
            songList = savedSongs;
            renderPlaylist();
            nowPlaying.textContent = "リストを読み込みました";
            // 起動時はURLをセットするだけ（自動再生はブロックされやすいため）
            loadSong(0); 
        }
    };

    folderInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).filter(f => 
            f.type.startsWith('audio/') || f.name.endsWith('.mp3') || f.name.endsWith('.m4a') || f.name.endsWith('.alac')
        );
        if (files.length === 0) return;
        nowPlaying.textContent = "保存中...";
        await db.songs.clear();
        for (const file of files) { await db.songs.add({ name: file.name, data: file }); }
        songList = await db.songs.toArray();
        renderPlaylist();
        playSong(0);
    });

    function renderPlaylist() {
        playlist.innerHTML = '';
        songList.forEach((file, index) => {
            const li = document.createElement('li');
            li.textContent = file.name;
            li.onclick = () => playSong(index);
            playlist.appendChild(li);
        });
    }

    // 「再生」を伴う処理
    async function playSong(index) {
        await loadSong(index);
        audioPlayer.play().catch(() => {
            nowPlaying.textContent = `[タップして再生] ${songList[index].name}`;
        });
    }

    // 「読み込み」に集中する処理（秒数が出ない問題を解決）
    async function loadSong(index) {
        const song = songList[index];
        if (!song) return;

        // 古いメモリを解放
        if (audioPlayer.src) URL.revokeObjectURL(audioPlayer.src);

        const url = URL.createObjectURL(song.data);
        audioPlayer.src = url;
        
        // 【重要】データを強制的に読み込ませる
        audioPlayer.load();

        nowPlaying.textContent = song.name;
        loadCoverArt(song.data, (imageUrl) => {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.name,
                    artist: 'My Music Player',
                    artwork: [{ src: imageUrl, sizes: '512x512', type: 'image/png' }]
                });
                navigator.mediaSession.setActionHandler('previoustrack', () => playSong(index > 0 ? index - 1 : 0));
                navigator.mediaSession.setActionHandler('nexttrack', () => playSong(index < songList.length - 1 ? index + 1 : index));
            }
        });

        Array.from(playlist.children).forEach((li, i) => {
            li.className = (i === index) ? 'active' : '';
        });
    }

    function loadCoverArt(fileBlob, callback) {
        window.jsmediatags.read(fileBlob, {
            onSuccess: function(tag) {
                const pic = tag.tags.picture;
                if (pic) {
                    let base64 = "";
                    for (let i = 0; i < pic.data.length; i++) base64 += String.fromCharCode(pic.data[i]);
                    const imageUrl = `data:${pic.format};base64,${window.btoa(base64)}`;
                    coverImage.src = imageUrl;
                    coverImage.style.display = 'block';
                    placeholder.style.display = 'none';
                    if (callback) callback(imageUrl); 
                } else { showDefaultCover(callback); }
            },
            onError: function() { showDefaultCover(callback); }
        });
    }

    function showDefaultCover(callback) {
        const fallbackUrl = 'https://via.placeholder.com/512';
        coverImage.style.display = 'none';
        placeholder.style.display = 'block';
        if (callback) callback(fallbackUrl);
    }

    audioPlayer.onended = () => {
        let currentText = nowPlaying.textContent.replace('[タップして再生] ', '');
        let currentIndex = songList.findIndex(f => f.name === currentText);
        if (currentIndex !== -1 && currentIndex < songList.length - 1) playSong(currentIndex + 1);
    };
</script>
</body>
</html>
