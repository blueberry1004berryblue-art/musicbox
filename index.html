<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        
        /* フォルダ選択ボタン */
        .upload-btn {
            background: #1DB954; color: white; padding: 15px; border-radius: 30px;
            display: inline-block; cursor: pointer; margin-bottom: 20px; font-weight: bold;
        }
        input[type="file"] { display: none; }

        /* プレイヤー部分 */
        audio { width: 100%; margin: 20px 0; border-radius: 8px; }
        
        /* リスト部分 */
        #playlist { list-style: none; padding: 0; text-align: left; max-height: 400px; overflow-y: auto; }
        #playlist li {
            padding: 12px; border-bottom: 1px solid #333; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #playlist li:hover { background: #222; }
        #playlist li.active { color: #1DB954; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Music Player</h2>
    
    <label class="upload-btn">
        フォルダを選択
        <input type="file" id="folderInput" webkitdirectory directory multiple>
    </label>

    <div id="nowPlaying">起動中...</div>
    <audio id="audioPlayer" controls></audio>

    <ul id="playlist"></ul>
</div>

<script>
    // 1. PWAのService Worker登録
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => {
            console.log('Service Worker Registered');
        });
    }

    // 2. データベースの準備 (Dexie.js)
    const db = new Dexie("SimpleMusicDB");
    db.version(1).stores({ songs: "++id, name, data" });

    const folderInput = document.getElementById('folderInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const playlist = document.getElementById('playlist');
    const nowPlaying = document.getElementById('nowPlaying');

    let songList = [];

    // 3. 起動時に保存された曲を自動で読み込む
    window.onload = async () => {
        const savedSongs = await db.songs.toArray();
        if (savedSongs.length > 0) {
            songList = savedSongs;
            renderPlaylist();
            nowPlaying.textContent = "前回読み込んだ曲をセットしました";
            // 自動再生を試みる（ブラウザにブロックされたらタップで再生）
            playSong(0);
        } else {
            nowPlaying.textContent = "フォルダを選択してください";
        }
    };

    // 4. フォルダ選択時にデータベースへ保存
    folderInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).filter(f => f.type.startsWith('audio/') || f.name.endsWith('.mp3'));
        
        if (files.length === 0) {
            alert('音楽ファイルが見つかりませんでした。');
            return;
        }

        nowPlaying.textContent = "曲を保存中...";
        await db.songs.clear(); // 古いデータを削除

        for (const file of files) {
            await db.songs.add({ name: file.name, data: file });
        }

        songList = await db.songs.toArray();
        renderPlaylist();
        playSong(0);
    });

    function renderPlaylist() {
        playlist.innerHTML = '';
        songList.forEach((file, index) => {
            const li = document.createElement('li');
            li.textContent = file.name;
            li.onclick = () => playSong(index);
            playlist.appendChild(li);
        });
    }

    function playSong(index) {
        const song = songList[index];
        // 保存されたデータから再生用URLを生成
        const url = URL.createObjectURL(song.data); 
        
        audioPlayer.src = url;
        audioPlayer.play().catch(() => {
            // 自動再生がブラウザに弾かれた場合の保険
            nowPlaying.textContent = `[タップして再生] ${song.name}`;
        });
        
        nowPlaying.textContent = `再生中: ${song.name}`;

        // アクティブな曲に色をつける
        Array.from(playlist.children).forEach((li, i) => {
            li.className = (i === index) ? 'active' : '';
        });
    }

    // 曲が終わったら次の曲へ
    audioPlayer.onended = () => {
        let currentText = nowPlaying.textContent.replace('再生中: ', '').replace('[タップして再生] ', '');
        let currentIndex = songList.findIndex(f => f.name === currentText);
        
        if (currentIndex !== -1 && currentIndex < songList.length - 1) {
            playSong(currentIndex + 1);
        }
    };
</script>

</body>
</html>
