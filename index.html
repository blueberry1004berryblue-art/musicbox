<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; }
        
        /* フォルダ選択ボタン */
        .upload-btn {
            background: #1DB954; color: white; padding: 15px; border-radius: 30px;
            display: inline-block; cursor: pointer; margin-bottom: 20px; font-weight: bold;
        }
        input[type="file"] { display: none; }

        /* ジャケット画像エリア */
        #coverContainer {
            width: 250px; height: 250px; margin: 10px auto 20px;
            background: #222; border-radius: 10px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #coverImage { width: 100%; height: 100%; object-fit: cover; display: none; }
        #placeholder { font-size: 60px; color: #444; }

        /* プレイヤー部分 */
        audio { width: 100%; margin: 10px 0; border-radius: 8px; }
        
        /* リスト部分 */
        #playlist { list-style: none; padding: 0; text-align: left; max-height: 300px; overflow-y: auto; }
        #playlist li {
            padding: 12px; border-bottom: 1px solid #333; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #playlist li:hover { background: #222; }
        #playlist li.active { color: #1DB954; font-weight: bold; background: #1a1a1a; }
    </style>
</head>
<body>

<div class="container">
    <h2>Music Player</h2>
    
    <label class="upload-btn">
        フォルダを選択
        <input type="file" id="folderInput" webkitdirectory directory multiple>
    </label>

    <div id="coverContainer">
        <div id="placeholder">♪</div>
        <img id="coverImage" alt="Album Art">
    </div>

    <div id="nowPlaying">起動中...</div>
    <audio id="audioPlayer" controls></audio>

    <ul id="playlist"></ul>
</div>

<script>
    // 1. PWAのService Worker登録
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    // 2. データベースの準備
    const db = new Dexie("MusicAppDB");
    db.version(1).stores({ songs: "++id, name, data" });

    const folderInput = document.getElementById('folderInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const playlist = document.getElementById('playlist');
    const nowPlaying = document.getElementById('nowPlaying');
    const coverImage = document.getElementById('coverImage');
    const placeholder = document.getElementById('placeholder');

    let songList = [];

    // 3. 起動時に保存された曲を自動で読み込む
    window.onload = async () => {
        const savedSongs = await db.songs.toArray();
        if (savedSongs.length > 0) {
            songList = savedSongs;
            renderPlaylist();
            nowPlaying.textContent = "リストを読み込みました";
            playSong(0);
        } else {
            nowPlaying.textContent = "フォルダを選択してください";
        }
    };

    // 4. フォルダ選択時にデータベースへ保存
    folderInput.addEventListener('change', async (e) => {

	const files = Array.from(e.target.files).filter(f => 
            f.type.startsWith('audio/') || 
            f.name.endsWith('.mp3') || 
            f.name.endsWith('.m4a') || 
            f.name.endsWith('.alac')
        );


        if (files.length === 0) return;

        nowPlaying.textContent = "保存中...";
        await db.songs.clear();

        for (const file of files) {
            await db.songs.add({ name: file.name, data: file });
        }

        songList = await db.songs.toArray();
        renderPlaylist();
        playSong(0);
    });

    function renderPlaylist() {
        playlist.innerHTML = '';
        songList.forEach((file, index) => {
            const li = document.createElement('li');
            li.textContent = file.name;
            li.onclick = () => playSong(index);
            playlist.appendChild(li);
        });
    }

    async function playSong(index) {
        const song = songList[index];
        const url = URL.createObjectURL(song.data); 
        
        audioPlayer.src = url;
        audioPlayer.play().catch(() => {
            nowPlaying.textContent = `[タップして再生] ${song.name}`;
        });
        
        nowPlaying.textContent = song.name;
        
        // 5. ジャケット画像の読み取りと、Android通知欄への反映
        loadCoverArt(song.data, (imageUrl) => {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.name,         // 通知欄にファイル名（曲名）を表示
                    artist: 'My Music Player', // アーティスト名
                    album: 'Local Collection', // アルバム名
                    artwork: [
                        { src: imageUrl, sizes: '96x96',   type: 'image/png' },
                        { src: imageUrl, sizes: '128x128', type: 'image/png' },
                        { src: imageUrl, sizes: '192x192', type: 'image/png' },
                        { src: imageUrl, sizes: '256x256', type: 'image/png' },
                        { src: imageUrl, sizes: '384x384', type: 'image/png' },
                        { src: imageUrl, sizes: '512x512', type: 'image/png' },
                    ]
                });

                // 通知欄のスキップボタンを有効化
                navigator.mediaSession.setActionHandler('previoustrack', () => {
                    if (index > 0) playSong(index - 1);
                });
                navigator.mediaSession.setActionHandler('nexttrack', () => {
                    if (index < songList.length - 1) playSong(index + 1);
                });
            }
        });

        Array.from(playlist.children).forEach((li, i) => {
            li.className = (i === index) ? 'active' : '';
        });
    }

    function loadCoverArt(fileBlob, callback) {
        window.jsmediatags.read(fileBlob, {
            onSuccess: function(tag) {
                const pic = tag.tags.picture;
                if (pic) {
                    let base64 = "";
                    for (let i = 0; i < pic.data.length; i++) {
                        base64 += String.fromCharCode(pic.data[i]);
                    }
                    const imageUrl = `data:${pic.format};base64,${window.btoa(base64)}`;
                    coverImage.src = imageUrl;
                    coverImage.style.display = 'block';
                    placeholder.style.display = 'none';
                    if (callback) callback(imageUrl); 
                } else {
                    showDefaultCover(callback);
                }
            },
            onError: function() {
                showDefaultCover(callback);
            }
        });
    }

    function showDefaultCover(callback) {
        const fallbackUrl = 'https://via.placeholder.com/512';
        coverImage.style.display = 'none';
        placeholder.style.display = 'block';
        if (callback) callback(fallbackUrl);
    }

    audioPlayer.onended = () => {
        let currentText = nowPlaying.textContent.replace('再生中: ', '').replace('[タップして再生] ', '');
        let currentIndex = songList.findIndex(f => f.name === currentText);
        if (currentIndex !== -1 && currentIndex < songList.length - 1) {
            playSong(currentIndex + 1);
        }
    };
</script>
</body>
</html>
