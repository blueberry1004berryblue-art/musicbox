<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player with Cover</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #121212; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
        
        /* カバー画像表示エリア */
        #coverContainer {
            width: 250px; height: 250px; margin: 20px auto;
            background: #333; border-radius: 15px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
        }
        #coverImage { width: 100%; height: 100%; object-fit: cover; display: none; }
        #placeholder { font-size: 50px; color: #555; }

        .upload-btn {
            background: #1DB954; color: white; padding: 12px 24px; border-radius: 25px;
            display: inline-block; cursor: pointer; margin: 10px 0; font-weight: bold;
        }
        input[type="file"] { display: none; }

        #nowPlaying { margin-top: 10px; font-weight: bold; height: 1.5em; overflow: hidden; }
        audio { width: 100%; margin: 20px 0; }

        #playlist { 
            list-style: none; padding: 0; margin-top: 20px; 
            text-align: left; background: #1e1e1e; border-radius: 10px;
        }
        #playlist li {
            padding: 15px; border-bottom: 1px solid #282828; cursor: pointer;
            font-size: 0.9em; transition: 0.2s;
        }
        #playlist li.active { color: #1DB954; background: #282828; }
    </style>
<link rel="manifest" href="manifest.json">
</head>
<body>

<div class="container">
    <h2>My Player</h2>
    
    <label class="upload-btn">
        フォルダを選択
        <input type="file" id="folderInput" webkitdirectory directory multiple>
    </label>

    <div id="coverContainer">
        <div id="placeholder">♪</div>
        <img id="coverImage" src="" alt="Album Art">
    </div>

    <div id="nowPlaying">曲を選択してください</div>
    <audio id="audioPlayer" controls></audio>

    <ul id="playlist"></ul>
</div>

<script>
    const jsmediatags = window.jsmediatags;
    const folderInput = document.getElementById('folderInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const playlist = document.getElementById('playlist');
    const nowPlaying = document.getElementById('nowPlaying');
    const coverImage = document.getElementById('coverImage');
    const placeholder = document.getElementById('placeholder');

    let songList = [];

    folderInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        songList = files.filter(file => file.type.startsWith('audio/') || file.name.endsWith('.mp3'));
        if (songList.length > 0) renderPlaylist();
    });

    function renderPlaylist() {
        playlist.innerHTML = '';
        songList.forEach((file, index) => {
            const li = document.createElement('li');
            li.textContent = file.name;
            li.onclick = () => playSong(index);
            playlist.appendChild(li);
        });
    }

    function playSong(index) {
        const file = songList[index];
        const url = URL.createObjectURL(file);
        
        audioPlayer.src = url;
        audioPlayer.play();
        nowPlaying.textContent = file.name;

        // カバー画像の読み込み
        loadCoverArt(file);

        // リストの更新
        Array.from(playlist.children).forEach((li, i) => {
            li.className = (i === index) ? 'active' : '';
        });
    }

    function loadCoverArt(file) {
        jsmediatags.read(file, {
            onSuccess: function(tag) {
                const tags = tag.tags;
                if (tags.picture) {
                    const { data, format } = tags.picture;
                    let base64String = "";
                    for (let i = 0; i < data.length; i++) {
                        base64String += String.fromCharCode(data[i]);
                    }
                    coverImage.src = `data:${format};base64,${window.btoa(base64String)}`;
                    coverImage.style.display = 'block';
                    placeholder.style.display = 'none';
                } else {
                    resetCover();
                }
            },
            onError: function(error) {
                console.log(error);
                resetCover();
            }
        });
    }

    function resetCover() {
        coverImage.style.display = 'none';
        placeholder.style.display = 'block';
    }

    audioPlayer.onended = () => {
        let currentIndex = songList.findIndex(f => nowPlaying.textContent === f.name);
        if (currentIndex < songList.length - 1) playSong(currentIndex + 1);
    };
</script>

</body>
</html>
